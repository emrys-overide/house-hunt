    <script>
      // Suppress Vite HMR connection closed messages from showing as error popups in iframe
      window.addEventListener('unhandledrejection', function(event) {
        var str = String(event && (event.reason?.message || event.reason || ''));
        if (str.includes('WebSocket') || str.includes('websocket') || str.includes('vite')) {
          event.preventDefault();
          if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var str = String(event && (event.message || event.error?.message || ''));
        if (str.includes('WebSocket') || str.includes('websocket') || str.includes('vite')) {
          event.preventDefault();
        }
      });
    </script>
